---
# GitLab CI/CD Pipeline for fips
# SPDX-License-Identifier: Apache-2.0
#
# Reusable components live in gitlab.com/devnw/ci-catalog.
# Zig components pinned at v1.22.0 (first tag with multi-OS + test_step
# + bounded zig-fuzz). Security/SBOM components stay on their existing
# pins since those APIs haven't changed.
#
# Linux jobs run on company-tagged runners. macOS jobs use GitLab SaaS
# (`saas-macos-medium-m1`); Windows jobs use isolated GitLab-hosted VMs
# with Visual Studio Build Tools (`saas-windows-medium-amd64`). Cross-OS jobs are gated
# behind rules + allow_failure so pipelines without those runners still
# pass. Trigger cross-OS runs by setting RUN_CROSS_OS=true or by
# scheduling / merging to the default branch.

# Cancel in-flight pipelines on new commits for everything except
# release-producing runs (tag pipelines and default-branch pipelines,
# which feed `release-semantic`). All jobs default to interruptible so
# the auto-cancel actually kicks in; opt out per-job when needed.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # SRE-194: validation pipelines fail fast on the first blocking job failure;
  # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

default:
  interruptible: true
  tags:
    - company
    - linux
  # Policy-injected scanner jobs inherit these tags; their GitLab SAST images
  # are AMD64-only, so keep them off the ARM fleet (SRE-183).
    - amd64

# Prove that the public-key exception remains narrowly scoped with the exact
# scanner image used for the required history scan below.
security-gitleaks:
  before_script:
    - sh scripts/test_gitleaks_allowlist.sh

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release
  # release-semantic: commit that ci-catalog tag v1.55.8 resolved to
  # (job-token creation of NEW releases under pipefail, SONNY-3448).
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
      tags: ["company", "linux"]

  # Zig formatting (Linux).
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      paths: "src/ tests/ examples/"

  # Zig build (Linux): static lib + CLI + check-compile.
  - component: gitlab.com/devnw/ci-catalog/zig-build@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: build
      zig_version: "0.16.0"
      build_options: "build check -Dopenssl_path=/usr/local/ssl"

  # Zig tests — Linux matrix across optimize modes + integration + stress.
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-debug"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test"
      optimize: "Debug"
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesafe"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test"
      optimize: "ReleaseSafe"
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasefast"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test"
      optimize: "ReleaseFast"
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesmall"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test"
      optimize: "ReleaseSmall"
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test-integration"
  - component: gitlab.com/devnw/ci-catalog/zig-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_options: "--summary all -Dopenssl_path=/usr/local/ssl"
      test_step: "test-stress"

  # Fuzz sweep (advisory). fuzz_duration is the in-shell SIGINT
  # budget; timeout: is GitLab's job cap.
  - component: gitlab.com/devnw/ci-catalog/zig-fuzz@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      test_step: "test"
      test_options: "--fuzz -Dopenssl_path=/usr/local/ssl"
      fuzz_duration: "60"
      timeout: "5m"
      allow_failure: true

  # Zig build + tests on macOS (gated).
  - component: gitlab.com/devnw/ci-catalog/zig-build-macos@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      build_step: "build"
      build_options: "check"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_step: "test-integration"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_step: "test-stress"

  # SONNY-2770: the OpenSSL x64-windows triplet requires MSVC. The company
  # runner lacks a usable Visual Studio installation, and concurrent jobs
  # collide on the catalog bootstrap's shared TEMP downloads. Hosted Windows
  # provides the build tools and a fresh VM per job. Project hosted runners
  # must be enabled before the native acceptance pipeline can execute.
  - component: gitlab.com/devnw/ci-catalog/zig-build-windows@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      build_step: "build"
      build_options: "check"
      tags: ["saas-windows-medium-amd64"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
      tags: ["saas-windows-medium-amd64"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_step: "test-integration"
      tags: ["saas-windows-medium-amd64"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_step: "test-stress"
      tags: ["saas-windows-medium-amd64"]
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724

variables:
  ZIG_VERSION: "0.16.0"
  OPENSSL_VERSION: "3.6.5"
  OPENSSL_PREFIX: "/usr/local/ssl"

stages:
  - lint
  - dependencies
  - build
  - test
  - fuzz
  - performance
  - security
  - sbom
  - release

# ---------------------------------------------------------------
# Cross-OS gating: apply rules to the catalog-generated jobs so
# macOS / Windows only run on default branch, schedule, or when
# RUN_CROSS_OS=true. Elsewhere they fall back to manual.
# ---------------------------------------------------------------

.cross-os-rules: &cross-os-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_CROSS_OS == "true"'
  - when: manual
    allow_failure: true

zig-build-macos-0.16.0:
  rules: *cross-os-rules
  script:
    - bash scripts/ci-macos.sh build check

zig-test-macos-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  script:
    - bash scripts/ci-macos.sh test

zig-test-macos-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  script:
    - bash scripts/ci-macos.sh test-integration

zig-test-macos-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  script:
    - bash scripts/ci-macos.sh test-stress

zig-build-windows-0.16.0:
  rules: *cross-os-rules
  script:
    - '& ./scripts/ci-windows.ps1 -Steps @("build", "check")'

zig-test-windows-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]
  script:
    - '& ./scripts/ci-windows.ps1 -Steps @("test")'

zig-test-windows-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]
  script:
    - '& ./scripts/ci-windows.ps1 -Steps @("test-integration")'

zig-test-windows-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]
  script:
    - '& ./scripts/ci-windows.ps1 -Steps @("test-stress")'

# ---------------------------------------------------------------
# Benchmark regression gating.
#
# The default `bench` step runs the suite defined in
# benchmarks/bench.zig and writes JSON to benchmarks/results/. The
# `compare-bench` step diffs that against benchmarks/results/baseline.json
# and exits non-zero on a regression beyond the noise gate (default
# floor 15%). Both jobs install Zig directly via scripts/install-zig.sh
# on a stock ubuntu:26.04 image so the benchmark machine matches the
# build matrix above without depending on a catalog image bump.
#
# Gated to default branch / schedule / RUN_BENCH=true; advisory until
# a real baseline lands (allow_failure: true in benchmark-regression).
# Drop allow_failure once baseline.json reflects a stable release.
# ---------------------------------------------------------------

.zig-host-base:
  image: "ubuntu:26.04"
  # Producer and consumers must use the same OS, ABI, and architecture.
  # `x86` selects the x86_64 Linux pool (OVH dedicated runners plus the AWS
  # overflow autoscaler); the image pins the OS/ABI. The amd64+docker pool
  # (Lab Servers, company k8s) is often saturated by other projects, which
  # left fips-deps pending for 45+ minutes.
  tags: ["company", "linux", "x86"]
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils git build-essential python3
    - bash scripts/install-zig.sh "$ZIG_VERSION"
    - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
    - zig version

.fips-linux-consumer:
  extends: .zig-host-base
  needs: ["fips-deps"]
  before_script:
    - !reference [.zig-host-base, before_script]
    - python3 scripts/ci_openssl_artifact.py restore
    - export OPENSSL_CONF="$OPENSSL_PREFIX/ssl/openssl.cnf"
    - bash scripts/verify-fips-provider.sh

# Keep each catalog job's script, optimization mode, and failure policy.
# Their host setup must restore the provider before compiling or executing.
zig-build-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-unit-debug-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-unit-releasesafe-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-unit-releasefast-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-unit-releasesmall-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-integration-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-test-stress-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

zig-fuzz-0.16.0:
  tags: !reference [.zig-host-base, tags]
  needs: ["fips-deps"]
  before_script: !reference [.fips-linux-consumer, before_script]

.bench-rules: &bench-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_BENCH == "true"'
  - when: manual
    allow_failure: true

benchmark-regression:
  extends: .fips-linux-consumer
  stage: performance
  rules: *bench-rules
  script:
    - mkdir -p benchmarks/results
    - zig build bench -Dopenssl_path="$OPENSSL_PREFIX" -- --output benchmarks/results/ci-current.json
    - |
      if [ -f benchmarks/results/baseline.json ]; then
        zig build compare-bench -Dopenssl_path="$OPENSSL_PREFIX" -- --baseline benchmarks/results/baseline.json --current benchmarks/results/ci-current.json
      else
        echo "no benchmarks/results/baseline.json yet; skipping regression gate"
      fi
  artifacts:
    when: always
    paths:
      - benchmarks/results/ci-current.json
    expire_in: 30 days
  allow_failure: true # advisory until a stable baseline is committed

bench-micro:
  extends: .fips-linux-consumer
  stage: performance
  rules: *bench-rules
  script:
    - zig build bench-micro -Dopenssl_path="$OPENSSL_PREFIX"
  allow_failure: true # advisory; thresholds aren't gated yet

scale-bench:
  extends: .fips-linux-consumer
  stage: performance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  script:
    - mkdir -p benchmarks/results
    - timeout 300 zig build scale-bench -Dopenssl_path="$OPENSSL_PREFIX" -- --output benchmarks/results/scale-current.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/scale-current.json
    expire_in: 30 days

# ---------------------------------------------------------------
# FIPS-140-3 / PQC dual-mode gate.
#
# `fips-deps` builds the pinned OpenSSL + FIPS provider via `make deps`
# (installs to /usr/local/ssl) and `test-fips` runs the dual-mode gate
# (`make test-dual`): the std_shim path with NO OpenSSL link AND the
# OpenSSL FIPS-backend path (unit + interop). Linux-only; the source
# build needs build-essential + perl, provided by .zig-host-base + the
# script's own prereq step.
# ---------------------------------------------------------------
release-signature-tests:
  stage: test
  image: debian:bookworm-slim
  tags: ["company", "linux"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 gnupg
  script:
    - python3 scripts/test_release_signature.py -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

fips-deps:
  extends: .zig-host-base
  stage: dependencies
  # gnupg is installed above so the OpenSSL release GPG signature is checked;
  # REQUIRE_GPG=1 makes that authenticity check mandatory (fail closed if the
  # signature/key cannot be verified, e.g. a transient .asc fetch failure).
  variables:
    REQUIRE_GPG: "1"
  script:
    - apt-get install -y --no-install-recommends perl wget gnupg dirmngr sudo
    - curl -fsSL https://www.openssl-library.org/source/pubkeys.asc -o openssl-pubkeys.asc
    - gpg --batch --import openssl-pubkeys.asc
    - make deps
    - python3 scripts/ci_openssl_artifact.py pack
  artifacts:
    paths:
      - .ci-artifacts/openssl/
    expire_in: 1 day

test-fips:
  extends: .fips-linux-consumer
  stage: test
  needs: ["fips-deps"]
  script:
    - make test-dual

openssl-artifact-tests:
  stage: lint
  image: ubuntu:26.04
  tags: ["company", "linux"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3
  script:
    - python3 scripts/test_ci_openssl_artifact.py -v
