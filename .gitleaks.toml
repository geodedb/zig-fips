# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "fips Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''\.zig-cache''',
    '''zig-out''',
    '''\.git''',
]

# Add custom rules or allowlist entries as needed
# [[rules]]
# id = "custom-rule"
# description = "Custom secret pattern"
# regex = '''pattern'''

# Historical public OpenSSL signing-key identifiers, not API credentials.
# Match the exact value AND installer path: shallow Git history changes the
# finding commit, so a commit fingerprint would not be stable in CI.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public OpenSSL release signing-key fingerprints in the installer"
condition = "AND"
paths = ['''^scripts/install-openssl-fips\.sh$''']
regexTarget = "secret"
regexes = [
    '''^B146647E45A7B33947AB226B2A2C87D161692D40$''',
    '''^BA5473A2B0587B07FB27CF2D216094DFD0CB81EF$''',
]
