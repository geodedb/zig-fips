# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "fips Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''\.zig-cache''',
    '''zig-out''',
    '''\.git''',
]
# scripts/install-openssl-fips.sh: OpenSSL's public release-signing key
# fingerprints (OPENSSL_RELEASE_KEY_CURRENT/PREVIOUS), used to verify the
# downloaded tarball; not secrets. CI scans a shallow clone, so the commit
# at the clone boundary shows the script as newly added on every push;
# per-commit .gitleaksignore fingerprints can't keep up. Match only these
# two literal values.
regexes = [
    '''^B146647E45A7B33947AB226B2A2C87D161692D40$''',
    '''^BA5473A2B0587B07FB27CF2D216094DFD0CB81EF$''',
]

# Add custom rules or allowlist entries as needed
# [[rules]]
# id = "custom-rule"
# description = "Custom secret pattern"
# regex = '''pattern'''
